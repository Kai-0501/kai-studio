name: Weekly KaiLore cloud memory

on:
  schedule:
    # Sunday 00:00 UTC is Sunday 08:00 Asia/Singapore.
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency:
  group: weekly-kailore-cloud-memory
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  curate-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/kai-memory-cloud
          token: ${{ secrets.REPO_CREATOR_TOKEN }}
          path: memory-cloud
      - name: Review and merge substantial weekly updates
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MEMORY_MODEL: ${{ vars.GEMINI_MEMORY_MODEL || vars.GEMINI_IDEA_MODEL || 'gemini-3.5-flash' }}
          MEMORY_WORKTREE: memory-cloud
        run: node scripts/sync-cloud-memory.mjs
      - name: Save the reviewed memory privately
        working-directory: memory-cloud
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No memory changes to commit."
            exit 0
          fi
          git config user.name "KaiLore Cloud"
          git config user.email "kailore-cloud@users.noreply.github.com"
          git add memory archive inbox
          git commit -m "Review weekly KaiLore memory"
          git push origin HEAD:main
